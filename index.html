<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini SmartAdvisor</title>
</head>

<body>

    <h1>Mini SmartAdvisor</h1>

    <p>
        A simple course scheduling application that helps students
        manage their courses and identify schedule conflicts.
    </p>

    <h2>Add Course</h2>

    <form>
        <label for="course">Course:</label>
        <input type="text" id="course" placeholder="COP 3530">

        <br><br>

        <label for="crn">CRN:</label>
        <input type="text" id="crn" placeholder="12345">

        <br><br>

        <label for="days">Days:</label>
        <input type="text" id="days" placeholder="MW">

        <br><br>

        <label for="startTime">Start Time:</label>
        <input type="time" id="startTime">

        <br><br>

        <label for="endTime">End Time:</label>
        <input type="time" id="endTime">

        <br><br>

        <button type="submit">Add Course</button>
    </form>

    <h2>My Courses</h2>

    <p>No courses have been added yet.</p>

</body>
</html>
